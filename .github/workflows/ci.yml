name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy-integration:
    name: Hosted runtime and concurrent budget admission
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: hardening
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked --extra dev
      - name: Exercise concurrent admission on SQLite and PostgreSQL
        env:
          NYC_HOUSING_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-${{ github.run_id }}@localhost:5432/hardening
        run: uv run pytest tests/test_hardening_legacy.py -q
      - name: Build and smoke-test the actual Docker runtime
        run: |
          docker build -t nyc-housing-hosted-test .
          docker run --rm -e APP_ENV=test -e DATABASE_URL=sqlite+pysqlite:///:memory: nyc-housing-hosted-test python -c "from app.main import app; assert app.title"

  bootstrap:
    name: Fresh launcher / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_MANAGED_PYTHON: "1"
      NYC_HOUSING_CONFIG: ""
    steps:
      - uses: actions/checkout@v4
      - name: Configure runner-local launcher paths
        shell: bash
        env:
          CI_UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/launcher-python
          CI_UV_CACHE_DIR: ${{ runner.temp }}/launcher-cache
        run: |
          printf '%s\n' "UV_PYTHON_INSTALL_DIR=$CI_UV_PYTHON_INSTALL_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "UV_CACHE_DIR=$CI_UV_CACHE_DIR" >> "$GITHUB_ENV"
      # No setup-uv or setup-python: this tests the distribution entry path.
      - name: First and offline repeat launch (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh start.sh --help
          sh start.sh --data-dir "$RUNNER_TEMP/Launcher Space ü" --skip-core --setup-only
          sh start.sh --data-dir "$RUNNER_TEMP/Launcher Space ü" --offline --setup-only
      - name: First and offline repeat launch (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\start.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\start.ps1 --data-dir "$env:RUNNER_TEMP\Launcher Space ü" --skip-core --setup-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\start.ps1 --data-dir "$env:RUNNER_TEMP\Launcher Space ü" --offline --setup-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      APP_ENV: test
      ARTIFACT_STORAGE_BACKEND: local
      EMBEDDING_PROVIDER: fake
      ANSWER_LLM_PROVIDER: fake
      NYC_HOUSING_OPENAI_API_KEY: ""
      NYC_HOUSING_SOCRATA_APP_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Configure runner-local test paths
        shell: bash
        env:
          CI_DATA_DIR: ${{ runner.temp }}/nyc-housing-test-data
          CI_CONFIG_PATH: ${{ runner.temp }}/nyc-housing-test-config/settings.json
          CI_ARTIFACT_PATH: ${{ runner.temp }}/legacy-test-artifacts
        run: |
          printf '%s\n' "NYC_HOUSING_DATA_DIR=$CI_DATA_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "NYC_HOUSING_CONFIG=$CI_CONFIG_PATH" >> "$GITHUB_ENV"
          printf '%s\n' "ARTIFACT_STORAGE_PATH=$CI_ARTIFACT_PATH" >> "$GITHUB_ENV"
      - name: Install locked Python 3.12 environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Build distributions
        run: uv build --no-sources
      - name: Audit distribution contents
        shell: bash
        run: uv run python -m app.maintenance.release_audit dist/*.whl dist/*.tar.gz
      - name: Smoke-test wheel outside checkout
        shell: bash
        run: |
          temp_root="$(mktemp -d)"
          uv venv --python 3.12 "$temp_root/venv"
          uv pip install --python "$temp_root/venv" dist/*.whl
          "$temp_root/venv/bin/nyc-housing" --data-dir "$temp_root/Space ü/workspace" setup --no-browser --json
          "$temp_root/venv/bin/nyc-housing" --data-dir "$temp_root/Space ü/workspace" migrate preflight --json
          "$temp_root/venv/bin/nyc-housing" --data-dir "$temp_root/Space ü/workspace" status --json
          "$temp_root/venv/bin/nyc-housing" --data-dir "$temp_root/Space ü/workspace" maintenance prune --json
          "$temp_root/venv/bin/nyc-housing" --data-dir "$temp_root/Space ü/workspace" maintenance prune --apply --json
          uv venv --python 3.12 "$temp_root/sdist-venv"
          uv pip install --python "$temp_root/sdist-venv" dist/*.tar.gz
          "$temp_root/sdist-venv/bin/nyc-housing" --data-dir "$temp_root/Source ü/workspace" setup --skip-core --no-browser --json
          "$temp_root/sdist-venv/bin/nyc-housing" --data-dir "$temp_root/Source ü/workspace" migrate preflight --json
        if: runner.os != 'Windows'
      - name: Smoke-test wheel outside checkout on Windows
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:RUNNER_TEMP "wheel-smoke"
          uv venv --python 3.12 "$tempRoot\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          uv pip install --python "$tempRoot\venv" $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $workspace = Join-Path $tempRoot "Space ü\workspace"
          & "$tempRoot\venv\Scripts\nyc-housing.exe" --data-dir $workspace setup --no-browser --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tempRoot\venv\Scripts\nyc-housing.exe" --data-dir $workspace migrate preflight --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tempRoot\venv\Scripts\nyc-housing.exe" --data-dir $workspace status --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tempRoot\venv\Scripts\nyc-housing.exe" --data-dir $workspace maintenance prune --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tempRoot\venv\Scripts\nyc-housing.exe" --data-dir $workspace maintenance prune --apply --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --python 3.12 "$tempRoot\sdist-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdist = Get-ChildItem dist\*.tar.gz | Select-Object -First 1
          uv pip install --python "$tempRoot\sdist-venv" $sdist.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceWorkspace = Join-Path $tempRoot "Source ü\workspace"
          & "$tempRoot\sdist-venv\Scripts\nyc-housing.exe" --data-dir $sourceWorkspace setup --skip-core --no-browser --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tempRoot\sdist-venv\Scripts\nyc-housing.exe" --data-dir $sourceWorkspace migrate preflight --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: runner.os == 'Windows'

  benchmark:
    name: 10k local retrieval benchmark
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      APP_ENV: test
      ARTIFACT_STORAGE_BACKEND: local
      EMBEDDING_PROVIDER: fake
      ANSWER_LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked
      - run: uv run nyc-housing benchmark --chunks 10000 --dimension 1536 --runs 20 --json
        env:
          ARTIFACT_STORAGE_PATH: ${{ runner.temp }}/legacy-test-artifacts

  browser-e2e:
    name: Chromium local journey
    runs-on: ubuntu-latest
    env:
      NYC_HOUSING_BROWSER_E2E: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      APP_ENV: test
      ARTIFACT_STORAGE_BACKEND: local
      EMBEDDING_PROVIDER: fake
      ANSWER_LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked --extra dev
      - name: Install test browser
        run: uv run playwright install --with-deps chromium
      - name: Run local browser journey
        run: uv run pytest tests/e2e/test_local_browser.py -q
        env:
          ARTIFACT_STORAGE_PATH: ${{ runner.temp }}/legacy-test-artifacts

  macos-desktop:
    name: Standalone macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Build ad-hoc-signed application and DMG
        run: scripts/build_macos_dmg.sh
      - name: Verify bundle signature and disk image
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/macos/NYC Housing Research.app"
          dmg="$(find dist/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: nyc-housing-macos-development
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
