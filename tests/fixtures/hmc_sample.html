    <h1>NYC Housing Maintenance Code</h1>
    <p>§ 27-2005 Duties of owner.</p>
    <p>The owner of a multiple dwelling shall keep the premises in good repair.</p>
    <p>§ 27-2029 Heat required.</p>
    <p>Owners must provide heat as required by NYC Admin Code § 27-2029.</p>
