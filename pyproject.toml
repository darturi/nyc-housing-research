[project]
name = "nyc-housing-rag"
version = "0.1.0"
description = "Locally operated NYC housing-law research application"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "numpy>=2.1.0,<3",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
nyc-housing = "app.cli.main:main"

[project.optional-dependencies]
credentials = [
    "keyring>=25.0.0",
]
desktop = [
    "keyring>=25.0.0",
    "py2app>=0.28.10,<0.29; sys_platform == 'darwin'",
    "pywebview>=6.2.1,<7; sys_platform == 'darwin'",
]
legacy = [
    "argon2-cffi>=23.1.0",
    "boto3>=1.35.0",
    "psycopg[binary]>=3.2.0",
]
dev = [
    "argon2-cffi>=23.1.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "playwright>=1.55.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
